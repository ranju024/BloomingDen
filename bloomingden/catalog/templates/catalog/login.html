{% extends "base.html" %}
{% block content %}
<div class="page-section">
  <h1>Log in</h1>
</div>
<form method="post" style="max-width: 420px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Log in</button>
</form>
<p style="margin-top: 16px;">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
