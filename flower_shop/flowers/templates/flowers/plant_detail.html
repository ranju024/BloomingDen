{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="detail-layout">
  <div>
    {% if plant.image %}
      <img src="{{ plant.image.url }}" alt="{{ plant.name }}">
    {% else %}
      <img src="{% static 'images/no-image.jpg' %}" alt="No image available">
    {% endif %}
  </div>
  <div>
    <h1>{{ plant.name }}</h1>
    <p>{{ plant.description }}</p>
    <h3>Rs. {{ plant.price }}</h3>
    <form action="{% url 'add_to_cart' 'plant' plant.pk %}" method="post">
        {% csrf_token %}
        <button class="add-cart-btn" style="width:auto; padding: 10px 24px;">Add to cart</button>
    </form>
    <a href="{% url 'plants_list' %}" class="back-link">← Back to plants</a>
  </div>
</div>
{% endblock %}
