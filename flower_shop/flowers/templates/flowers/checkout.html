{% extends "base.html" %}
{% block content %}
<h1>Checkout</h1>

<h3>Order Summary</h3>
<ul>
    {% for item in items %}
        <li>{{ item.name }} x {{ item.quantity }} - Rs.{{ item.subtotal }}</li>
    {% endfor %}
</ul>
<p><strong>Total: Rs.{{ total_price }}</strong></p>

<form method="post">
    {% csrf_token %}
    <label>Name: <input type="text" name="name" required></label><br>
    <label>Phone: <input type="text" name="phone" required></label><br>
    <label>Address: <textarea name="address" required></textarea></label><br>
    <button type="submit">Place Order</button>
</form>

{% endblock %}
