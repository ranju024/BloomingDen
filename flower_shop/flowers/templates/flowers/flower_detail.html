{% extends "base.html" %}
{% load static %}

{% block content %}

<h1>{{ flower.name }}</h1>

{% if flower.image %}
  <img src="{{ flower.image.url }}" width="300">
{% else %}
  <img src="{% static 'images/no-image.jpg' %}" width="300" alt="No image available">
{% endif %}

<p>{{ flower.description }}</p>

<h3>Price: Rs. {{ flower.price }}</h3>

<a href="/flowers">⬅ Back to Flowers</a>

{% endblock %}
